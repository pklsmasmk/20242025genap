<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Web Input Data</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="StyleData.css" />
</head>
<body>

  <div class="container">
    <h2 class="text-center mb-4 mt-3 fw-bold">Input Data User</h2>

    <ul class="nav nav-tabs mb-3" id="tabMenu" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="table-tab" data-bs-toggle="tab" data-bs-target="#tableTab" type="button" role="tab" aria-controls="tableTab" aria-selected="true">Data Tersimpan</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="form-tab" data-bs-toggle="tab" data-bs-target="#formTab" type="button" role="tab" aria-controls="formTab" aria-selected="false">Input Data</button>
      </li>
    </ul>

    <div class="mb-3">
      <button id="btnAddData" class="btn btn-success">Tambahkan Data</button>
      <button id="resetAllBtn" class="btn btn-danger">Reset Semua</button>
    </div>

    <div class="tab-content" id="tabContent">
      <div class="tab-pane fade show active" id="tableTab" role="tabpanel" aria-labelledby="table-tab">
        <div class="table-responsive">
          <table id="dataTable" class="table table-bordered">
            <thead>
              <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Usia</th>
                <th>Berat (kg)</th>
                <th>Tinggi (cm)</th>
                <th>Edit / Hapus Data</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="tab-pane fade" id="formTab" role="tabpanel" aria-labelledby="form-tab">
        <form id="dataForm" autocomplete="off" novalidate>
          <div class="row w-100">
            <div class="col-md-6 mb-3">
              <input type="text" id="nama" class="form-control" placeholder="Nama" required />
            </div>
            <div class="col-md-6 mb-3">
              <input type="number" id="usia" class="form-control" placeholder="Usia" required />
            </div>
            <div class="col-md-6 mb-3">
              <input type="number" id="berat" class="form-control" placeholder="Berat (kg)" required />
            </div>
            <div class="col-md-6 mb-3">
              <input type="number" id="tinggi" class="form-control" placeholder="Tinggi (cm)" required />
            </div>
          </div>

          <div class="action-buttons d-flex gap-3 mt-3">
            <button type="submit" class="submit-btn btn">Simpan Data</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal" id="alertModal">
    <div class="modal-content">
      <h3 id="modalText">Isi semua data yaa!</h3>
      <div class="modal-actions">
        <button class="cancel btn" id="closeModal">OK</button>
      </div>
    </div>
  </div>

  <div class="modal modal-small" id="resetModal">
    <div class="modal-content">
      <h3>Hapus semua data?</h3>
      <div class="modal-actions">
        <button class="danger btn" id="confirmReset">Ya</button>
        <button class="cancel btn" id="cancelReset">Tidak</button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="ScriptData.js"></script>
</body>
</html>
