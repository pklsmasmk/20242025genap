<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Form Input</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</head>

<body>
    <div class="utama">
        <h2><strong>/ Form Input Sederhana \</strong></h2>

        <div class="form-group">
            <label for="nama">Nama :</label>
            <input type="text" id="nama" autocomplete="off" placeholder="Masukkan nama...">
        </div>

        <div class="form-group">
            <label for="umur">Umur :</label>
            <input type="number" id="umur" autocomplete="off" placeholder="Masukkan umur...">
        </div>

        <div class="form-group">
            <label for="email">Email :</label>
            <input type="email" id="email" autocomplete="off" placeholder="Masukkan email...">
        </div>

        <button id="tambahBtn">Tambah</button>

        <table id="dataTabel">
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Umur</th>
                    <th>Email</th>
                    <th>Update</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</body>

</html>
