<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Form Input</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</head>

<body>
    <div class="container py-5">
        <div class="card shadow utama mx-auto">
            <div class="card-body p-4">
                <h2 class="mb-4 text-center text-success fw-semibold"><em>- Form Input Sederhana -</em></h2>

                <form id="dataForm" class="mb-4">
                    <div class="mb-3">
                        <label for="nama" class="form-label fw-semibold text-success">Nama :</label>
                        <input type="text" class="form-control custom-input" id="nama" placeholder="Masukkan nama..."
                            autocomplete="off">
                    </div>

                    <div class="mb-3">
                        <label for="umur" class="form-label fw-semibold text-success">Umur :</label>
                        <input type="number" class="form-control custom-input" id="umur" placeholder="Masukkan umur..."
                            autocomplete="off">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-success">Email :</label>
                        <input type="email" class="form-control custom-input" id="email" placeholder="Masukkan email..."
                            autocomplete="off">
                    </div>

                    <div class="text-end">
                        <button type="button" id="tambahBtn" class="btn btn-success px-4 shadow-sm">Tambah</button>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-bordered align-middle text-center" id="dataTabel">
                        <thead class="table-success">
                            <tr>
                                <th>Nama</th>
                                <th>Umur</th>
                                <th>Email</th>
                                <th>Update</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
